name: ZaMaGui Business - FTPS release
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type DEPLOY_BUSINESS to publish business.zamagui.com'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: zamagui-business-production
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check business payload
        run: bash scripts/check-business.sh
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'DEPLOY_BUSINESS'
    environment: business-production
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check again
        run: bash scripts/check-business.sh
      - name: Install FTPS client
        run: sudo apt-get update -qq && sudo apt-get install -y lftp
      - name: Require all FTPS secrets
        env:
          FTPS_HOST: ${{ secrets.BUSINESS_FTPS_HOST }}
          FTPS_USER: ${{ secrets.BUSINESS_FTPS_USER }}
          FTPS_PASSWORD: ${{ secrets.BUSINESS_FTPS_PASSWORD }}
        run: |
          test -n "$FTPS_HOST" && test -n "$FTPS_USER" && test -n "$FTPS_PASSWORD"
      - name: Publish isolated Business directory using explicit FTPS
        env:
          FTPS_HOST: ${{ secrets.BUSINESS_FTPS_HOST }}
          FTPS_USER: ${{ secrets.BUSINESS_FTPS_USER }}
          FTPS_PASSWORD: ${{ secrets.BUSINESS_FTPS_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cat > "$HOME/.lftprc" <<'CONFIG'
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 20
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ftp:ssl-auth TLS
          set ssl:verify-certificate yes
          set ftp:passive-mode yes
          CONFIG
          cat > "$RUNNER_TEMP/ftps.lftp" <<'SCRIPT'
          mirror --reverse --verbose --no-perms --parallel=1 business-site/ /
          bye
          SCRIPT
          lftp -u "$FTPS_USER","$FTPS_PASSWORD" "ftp://$FTPS_HOST" -f "$RUNNER_TEMP/ftps.lftp"
      - name: Verify live response
        run: |
          curl --fail --location --silent --show-error --retry 3 \
            --max-time 20 https://business.zamagui.com/ > "$RUNNER_TEMP/business-live.html"
          grep -q 'ZaMaGui Business' "$RUNNER_TEMP/business-live.html"
